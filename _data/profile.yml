recruitment:
  headline: 和我一起，用数据与模型理解复杂系统
  intro: >-
    课题组持续欢迎对复杂网络、供应链与贸易网络风险、数据智能和管理决策感兴趣的同学。
    希望你愿意面对真实问题、持续学习，并通过可复现的计算研究形成可靠结论。
  programs:
    - type: 博士研究生
      degree: 管理科学与工程（学术博士）
      focus: 管理科学理论、方法和技术方向
    - type: 硕士研究生
      degree: 管理科学与工程（学术硕士）
      focus: 复杂网络、供应链韧性与风险管理
    - type: 专业硕士
      degree: 电子信息
      focus: 数据智能、计算方法与管理应用
  topics:
    - 新能源关键矿产与供应链网络韧性
    - 贸易网络风险传播与系统复杂性
    - 复杂网络建模、仿真与数据分析
    - 人工智能与数据驱动的管理决策
  support:
    - title: 算力与数据
      text: 提供充足的计算资源、实验环境和研究所需的数据支持，保障模型训练、网络仿真与大规模数据分析。
    - title: 科研经费
      text: 为参与课题组研究项目的学生提供充足且合规的科研经费支持，用于数据、计算、调研与学术交流等研究活动。
    - title: 研究指导
      text: 通过定期讨论、代码复现、论文精读与写作反馈，帮助学生建立规范、独立、可持续的研究能力。
    - title: 成长机会
      text: 鼓励学生参与真实科研项目、学术会议及跨学科合作，并根据研究进展支持高质量成果发表。
  expectations:
    - 具备编程基础，能够使用 Python、R 或其他适用语言完成数据处理与模型实现
    - 熟练使用 AI 大模型工具辅助研究，能够验证模型输出并保持独立判断，做到驾驭 AI 而不是盲从 AI
    - 具备基本的数学、统计或运筹学基础，并愿意继续补充复杂网络与计算方法知识
    - 能够阅读英文文献，愿意接受规范的学术写作与研究训练
    - 对研究问题保持好奇，做事认真主动，能够稳定投入并与团队合作
    - 重视研究伦理、数据规范和代码可复现性
  application: >-
    有兴趣的同学可通过邮件联系。建议在邮件中简要介绍教育背景、编程与研究经历、感兴趣的研究问题，
    并附个人简历；如有课程项目、代码仓库或代表性成果，也欢迎一并提供。

student_message: 欢迎对复杂网络、供应链风险与数据智能感兴趣的同学联系交流。

